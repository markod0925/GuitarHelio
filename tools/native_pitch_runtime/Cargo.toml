[package]
name = "native_pitch_runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Android detector runtime for GuitarHelio realtime pitch input."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
gh_dsp_core = { path = "../gh_dsp_core" }
guitar_pitch = { path = "../../../GHPitchDetection" }
fretnet_runtime = { path = "../../../GHPitchDetection/tools/FretNetRust/fretnet_runtime", default-features = false, features = ["ort-android"] }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
